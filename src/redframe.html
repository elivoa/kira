<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
  /* 聚焦输入框红框：只画边框线，无填充，轻微呼吸 */
  #frame {
    position: fixed;
    inset: 0;
    box-sizing: border-box;
    border: 3px solid rgba(255, 59, 48, 0.95);
    border-radius: 9px;
    animation: breathe 2.2s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { border-color: rgba(255, 59, 48, 0.95); box-shadow: 0 0 4px rgba(255, 59, 48, 0.25); }
    50% { border-color: rgba(255, 59, 48, 0.55); box-shadow: 0 0 9px rgba(255, 59, 48, 0.45); }
  }
</style>
</head>
<body>
  <div id="frame"></div>
</body>
</html>
