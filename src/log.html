<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>小kiki 的日志</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 18px 20px;
    font: 13px/1.6 "PingFang SC", sans-serif;
    color: #33304f;
    background: #f6f5fb;
    user-select: none;
  }
  .head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  h1 { font-size: 17px; margin: 0; }
  #clear {
    border: none;
    background: #e8e6f2;
    color: #5b5680;
    font: 12px "PingFang SC", sans-serif;
    padding: 5px 12px;
    border-radius: 8px;
    cursor: pointer;
  }
  #clear:hover { background: #d9d5ec; }
  #list { display: flex; flex-direction: column; gap: 6px; }
  .entry {
    display: flex;
    align-items: baseline;
    gap: 8px;
    background: #fff;
    border-radius: 10px;
    padding: 7px 12px;
    box-shadow: 0 1px 4px rgba(60, 50, 120, 0.06);
  }
  .time { color: #a49ec4; font-size: 11px; flex: none; font-variant-numeric: tabular-nums; }
  .type {
    flex: none;
    font-size: 11px;
    padding: 1px 7px;
    border-radius: 6px;
    color: #fff;
  }
  .type-自主 { background: #7d6fd0; }
  .type-交互 { background: #e06a8a; }
  .type-系统 { background: #9a93b8; }
  .empty { color: #a49ec4; text-align: center; margin-top: 60px; }
</style>
</head>
<body>
  <div class="head">
    <h1>小kiki 的日志</h1>
    <button id="clear">清空日志</button>
  </div>
  <div id="list"></div>
  <script src="log.js"></script>
</body>
</html>
