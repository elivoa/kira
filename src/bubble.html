<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  /* 气泡对话框：独立窗口，底边中点锚定人物头顶；缩放由 JS 控制，有下限保证可读 */
  /* bottom 要装得下阴影：粘性光晕 6+22px × 最大缩放 1.5 ≈ 42px，不然被窗口底边切出直线 */
  #bubble {
    position: absolute;
    left: 50%;
    bottom: 44px;
    transform: translateX(-50%);
    transform-origin: 50% 100%;
    max-width: 480px;
    padding: 10px 18px;
    border-radius: 18px;
    background: rgba(255, 255, 255, 0.95);
    color: #3a3660;
    font: 600 20px/1.5 "PingFang SC", sans-serif;
    box-shadow: 0 4px 16px rgba(30, 30, 70, 0.18);
    opacity: 0;
    transition: opacity .18s ease;
    pointer-events: none;
    white-space: nowrap;
  }
  #bubble.show { opacity: 1; }
  /* 主动搭话的粘性气泡：星空紫渐变 + 呼吸光晕，不自动消失，点一下才关 */
  #bubble.sticky {
    pointer-events: auto; /* 基础样式是 none，必须恢复，否则真实点击永远到不了气泡 */
    background: linear-gradient(135deg, #8f83d8, #7d6fd0);
    color: #fff;
    white-space: normal;
    max-width: 460px;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    animation: stickyGlow 2s ease-in-out infinite alternate;
  }
  #bubble.sticky::after { border-top-color: #7d6fd0; }
  @keyframes stickyGlow {
    from { box-shadow: 0 6px 20px rgba(109, 93, 196, 0.45), 0 0 6px rgba(185, 168, 255, 0.45); }
    to { box-shadow: 0 6px 22px rgba(109, 93, 196, 0.6), 0 0 16px rgba(185, 168, 255, 0.85); }
  }
  #bubble .sticky-hint { display: block; font-size: 12px; font-weight: 400; opacity: 0.8; margin-top: 3px; }
  #bubble::after {
    content: '';
    position: absolute;
    left: 50%;
    bottom: -6px;
    margin-left: -6px;
    border: 6px solid transparent;
    border-top-color: rgba(255, 255, 255, 0.95);
    border-bottom: 0;
  }
</style>
</head>
<body>
  <div id="bubble"></div>
  <script src="bubble.js"></script>
</body>
</html>
