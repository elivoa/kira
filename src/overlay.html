<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
  }
  #ov { position: absolute; inset: 0; }
  /* ---------- 星盘右键菜单 ---------- */
  #menuLayer { position: absolute; inset: 0; pointer-events: none; }
  .rm-root { position: absolute; inset: 0; }
  .rm-backdrop { position: absolute; inset: 0; pointer-events: auto; }
  .rm-ring {
    position: absolute;
    border: 1px dashed rgba(168, 158, 226, 0.26);
    border-radius: 50%;
    pointer-events: none;
    transform: translate(-50%, -50%);
  }
  .rm-ring.r2 { border-color: rgba(190, 178, 255, 0.2); }
  /* 扇区高亮光楔：随聚焦项指向旋转，淡淡一层 */
  .rm-sector {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    transform: translate(-50%, -50%);
    opacity: 0;
    transition: opacity 0.15s ease;
  }
  @keyframes rmSpin { to { transform: translate(-50%, -50%) rotate(360deg); } }
  @keyframes rmSpinR { to { transform: translate(-50%, -50%) rotate(-360deg); } }
  .rm-ring.r1 { animation: rmSpin 26s linear infinite; }
  .rm-ring.r2 { animation: rmSpinR 34s linear infinite; }
  .rm-item {
    position: absolute;
    width: 64px;
    height: 64px;
    pointer-events: auto;
    transition: transform 0.3s cubic-bezier(0.18, 1.35, 0.36, 1), opacity 0.22s ease;
  }
  /* 玻璃面：深色半透明 + 1px 细边 + 顶部内高光，取代粗边渐变紫 */
  .rm-btn, .rm-pill, .rm-hub {
    background: rgba(20, 18, 40, 0.62);
    backdrop-filter: blur(16px) saturate(1.25);
    border: 1px solid rgba(255, 255, 255, 0.14);
    box-shadow: 0 8px 26px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    color: #e9ebf6;
    font-family: "PingFang SC", sans-serif;
    cursor: pointer;
    transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease, background 0.16s ease;
  }
  .rm-btn:hover, .rm-pill:hover,
  .rm-item.focus .rm-btn, .rm-item.pill.focus .rm-pill {
    background: rgba(52, 44, 100, 0.72);
    border-color: rgba(182, 168, 255, 0.55);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45), 0 0 16px rgba(150, 128, 255, 0.32),
      inset 0 1px 0 rgba(255, 255, 255, 0.12);
    transform: scale(1.07);
  }
  .rm-btn {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  @keyframes rmBob { from { transform: translateY(-1px); } to { transform: translateY(1.5px); } }
  .rm-icon { font-size: 21px; line-height: 1; animation: rmBob 2.4s ease-in-out infinite alternate; }
  .rm-label { font-size: 12px; font-weight: 500; letter-spacing: 1px; margin-top: 4px; color: #cfd3e8; }
  /* 大分组的多列网格（替代单列长胶囊）：最多 7 行一列，居中展开 */
  .rm-item.pill {
    width: 168px;
    height: 38px;
  }
  .rm-pill {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 0 16px;
    border-radius: 11px;
  }
  .rm-pill .rm-icon { font-size: 18px; line-height: 1; animation: none; flex: none; }
  .rm-pill .rm-label { font-size: 13.5px; font-weight: 500; letter-spacing: 0.5px; margin: 0; color: #dde1f0; }
  /* 网格首格的返回：更素一档 */
  .rm-item.pill.backrow .rm-pill {
    background: rgba(30, 28, 54, 0.55);
    color: #a9adc6;
  }
  .rm-hub {
    position: absolute;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    font-size: 17px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    transform: translate(-50%, -50%);
    pointer-events: auto;
    animation: rmPulse 2.4s ease-in-out infinite alternate;
    transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease, background 0.16s ease;
  }
  .rm-hub:hover {
    background: rgba(52, 44, 100, 0.72);
    border-color: rgba(182, 168, 255, 0.55);
    transform: translate(-50%, -50%) scale(1.07);
  }
  @keyframes rmPulse {
    from { box-shadow: 0 8px 26px rgba(0, 0, 0, 0.4), 0 0 8px rgba(150, 128, 255, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.08); }
    to { box-shadow: 0 8px 26px rgba(0, 0, 0, 0.4), 0 0 18px rgba(150, 128, 255, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.08); }
  }
  /* 啪叽拟声词 */
  .fx-pop {
    transform-box: fill-box;
    transform-origin: center;
    animation: fxpop .5s ease-out forwards;
  }
  @keyframes fxpop {
    0%   { opacity: 1; transform: scale(.3) rotate(-8deg); }
    55%  { opacity: 1; transform: scale(1.15) rotate(3deg); }
    100% { opacity: 0; transform: scale(1.35) rotate(0deg); }
  }
</style>
</head>
<body>
  <svg id="ov"></svg>
  <div id="menuLayer"></div>
  <script src="overlay.js"></script>
</body>
</html>
