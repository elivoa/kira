<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
  }
  /* kira 消息泡泡：哑光深石板底（近发件 box 的 #242631），边框与呼吸光晕留一点紫调以区分 */
  #kb {
    position: absolute;
    left: 50%;
    bottom: 44px; /* 装粘性光晕（6+22px × 缩放上限，防窗口底边切直线） */
    transform: translateX(-50%);
    max-width: 480px;
    padding: 12px 32px 14px 20px; /* 右侧给关闭按钮留位，别压正文 */
    border-radius: 18px;
    background: #262433;
    border: 1px solid #3c3954;
    color: #e8eaf4;
    font: 500 15px/1.6 "PingFang SC", sans-serif;
    opacity: 0;
    transition: opacity .18s ease;
    pointer-events: none;
    animation: stickyGlow 2s ease-in-out infinite alternate;
    /* 框的边缘是拖拽区；文字本身不拖（可选中） */
    -webkit-app-region: drag;
  }
  #kb.show { opacity: 1; pointer-events: auto; }
  @keyframes stickyGlow {
    from { box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45), 0 0 5px rgba(150, 130, 232, 0.10); }
    to { box-shadow: 0 6px 22px rgba(0, 0, 0, 0.55), 0 0 14px rgba(150, 130, 232, 0.22); }
  }
  #kb::after {
    content: '';
    position: absolute;
    left: 50%;
    bottom: -6px;
    margin-left: -6px;
    border: 6px solid transparent;
    border-top-color: #262433;
    border-bottom: 0;
  }
  /* 文字可选中；双击直达 kira tab，单击（没选中文字时）关闭 */
  #kbText {
    -webkit-app-region: no-drag;
    user-select: text;
    -webkit-user-select: text;
    cursor: text;
    max-height: 400px;
    overflow-y: auto;
  }
  /* markdown 样式对齐本本 .bubble.md（间距/字号一致）；颜色沿用深底浅字体系 */
  #kbText.md p { margin: 0 0 8px; }
  #kbText.md p:last-child { margin-bottom: 0; }
  #kbText.md h1, #kbText.md h2, #kbText.md h3, #kbText.md h4 { margin: 6px 0; font-size: 15px; }
  #kbText.md ul, #kbText.md ol { margin: 0 0 8px; padding-left: 20px; }
  #kbText.md blockquote { margin: 0 0 8px; padding-left: 10px; border-left: 3px solid rgba(255,255,255,.4); opacity: .85; }
  #kbText.md code { font-family: "SF Mono", Menlo, monospace; font-size: 12px; background: rgba(0,0,0,.25); border-radius: 4px; padding: 1px 4px; }
  #kbText.md pre { background: rgba(0,0,0,.25); border-radius: 8px; padding: 8px 10px; margin: 0 0 8px; overflow-x: auto; }
  #kbText.md pre code { background: none; padding: 0; }
  #kbText.md table { border-collapse: collapse; margin: 0 0 8px; font-size: 12px; }
  #kbText.md th, #kbText.md td { border: 1px solid rgba(255,255,255,.35); padding: 3px 8px; }
  #kbText.md hr { border: none; border-top: 1px dashed rgba(255,255,255,.4); margin: 8px 0; }
  #kbText.md .katex-display { margin: 0 0 8px; overflow-x: auto; overflow-y: hidden; padding: 2px 0; }
  #kbText.md a { color: #b7aef0; text-decoration: underline; cursor: pointer; }
  #kbText.md a:hover { cursor: pointer; }
  /* 角落小圆钮（右上 ✕ 关闭 / 右下 💬 打开 kira）：半透明，hover 提亮；no-drag 防成拖拽误触区 */
  #kbClose, #kbOpen {
    position: absolute;
    right: 8px;
    width: 18px;
    height: 18px;
    padding: 0;
    border: none;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.08);
    color: rgba(232, 234, 244, 0.65);
    font-size: 11px;
    line-height: 18px;
    text-align: center;
    cursor: pointer;
    -webkit-app-region: no-drag;
  }
  #kbClose { top: 7px; }
  #kbOpen { bottom: 7px; font-size: 12px; }
  #kbClose:hover, #kbOpen:hover { background: rgba(255, 255, 255, 0.2); color: #ffffff; }
  .kb-hint { display: block; font-size: 12px; font-weight: 400; opacity: 0.8; margin-top: 4px; -webkit-app-region: drag; user-select: none; }
</style>
  <link rel="stylesheet" href="../node_modules/katex/dist/katex.min.css">
</head>
<body>
  <div id="kb">
    <button id="kbClose" title="关闭">✕</button>
    <button id="kbOpen" title="打开 kira 对话">💬</button>
    <div id="kbText" class="md"></div>
    <span class="kb-hint">✦ 单击关闭 · 双击打开 kira</span>
  </div>
  <script src="../node_modules/markdown-it/dist/browser/markdown-it.umd.min.js"></script>
  <script src="../node_modules/katex/dist/katex.min.js"></script>
  <script src="../node_modules/katex/dist/contrib/auto-render.min.js"></script>
  <script src="markdown-stream.js"></script>
  <script src="kira_bubble.js"></script>
</body>
</html>
