<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
  }
  /* kira 消息泡泡：哑光深石板底（近发件 box 的 #242631），边框与呼吸光晕留一点紫调以区分 */
  #kb {
    position: absolute;
    /* left:50%+translate 会让 shrink-to-fit 的可用宽度只剩半窗（泡泡永远 ≤280px），
       改成 left/right:0 + margin auto 居中，fit-content 才能真的吃到 max-width */
    left: 0;
    right: 0;
    margin: 0 auto;
    width: fit-content;
    box-sizing: border-box;
    bottom: 44px; /* 装粘性光晕（6+22px × 缩放上限，防窗口底边切直线） */
    /* 宽度上限跟窗口走（默认 600-80=520 同旧值）：右下角手柄拖大窗口后泡泡才能真正变宽 */
    max-width: calc(100vw - 80px);
    padding: 12px 32px 14px 20px; /* 右侧给关闭按钮留位，别压正文 */
    border-radius: 18px;
    background: #262433;
    border: 1px solid #3c3954;
    color: #e8eaf4;
    font: 400 13px/1.6 "PingFang SC", sans-serif; /* 字号/字重对齐小本本 .bubble.md（14px 常规），避免粗体感 */
    opacity: 0;
    transition: opacity .18s ease;
    pointer-events: none;
    animation: stickyGlow 2s ease-in-out infinite alternate;
    /* 框的边缘是拖拽区；文字本身不拖（可选中） */
    -webkit-app-region: drag;
  }
  #kb.show { opacity: 1; pointer-events: auto; }
  @keyframes stickyGlow {
    from { box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45), 0 0 5px rgba(150, 130, 232, 0.10); }
    to { box-shadow: 0 6px 22px rgba(0, 0, 0, 0.55), 0 0 14px rgba(150, 130, 232, 0.22); }
  }
  #kb::after {
    content: '';
    position: absolute;
    left: 50%;
    bottom: -6px;
    margin-left: -6px;
    border: 6px solid transparent;
    border-top-color: #262433;
    border-bottom: 0;
  }
  /* 文字可选中；双击直达 kira tab，Esc 或右上角 ✕ 关闭 */
  #kbText {
    -webkit-app-region: no-drag;
    user-select: text;
    -webkit-user-select: text;
    cursor: text;
    /* 跟窗口高度走（默认 520-120=400 同旧值）：窗口拖高后长文能少滚动 */
    max-height: calc(100vh - 120px);
    overflow-y: auto;
  }
  /* markdown 样式对齐本本 .bubble.md（间距/字号一致）；颜色沿用深底浅字体系 */
  #kbText.md p { margin: 0 0 8px; }
  #kbText.md p:last-child { margin-bottom: 0; }
  #kbText.md h1, #kbText.md h2, #kbText.md h3, #kbText.md h4 { margin: 6px 0; font-size: 14px; font-weight: 600; }
  /* PingFang SC 的 bold(700) 在小字号下糊成一团，压到 600 */
  #kbText.md strong, #kbText.md b { font-weight: 600; }
  #kbText.md ul, #kbText.md ol { margin: 0 0 8px; padding-left: 20px; }
  #kbText.md blockquote { margin: 0 0 8px; padding-left: 10px; border-left: 3px solid rgba(255,255,255,.4); opacity: .85; }
  #kbText.md code { font-family: "SF Mono", Menlo, monospace; font-size: 12px; background: rgba(0,0,0,.25); border-radius: 4px; padding: 1px 4px; }
  #kbText.md pre { background: rgba(0,0,0,.25); border-radius: 8px; padding: 8px 10px; margin: 0 0 8px; overflow-x: auto; }
  #kbText.md pre code { background: none; padding: 0; }
  #kbText.md table { border-collapse: collapse; margin: 0 0 8px; font-size: 12px; }
  #kbText.md th, #kbText.md td { border: 1px solid rgba(255,255,255,.35); padding: 3px 8px; }
  #kbText.md hr { border: none; border-top: 1px dashed rgba(255,255,255,.4); margin: 8px 0; }
  #kbText.md .katex-display { margin: 0 0 8px; overflow-x: auto; overflow-y: hidden; padding: 2px 0; }
  #kbText.md a { color: #b7aef0; text-decoration: underline; cursor: pointer; }
  #kbText.md a:hover { cursor: pointer; }
  /* 角落小圆钮（右上 ✕ 关闭 / 右下 💬 打开 kira、飞书、复位、拖拽手柄）：半透明，hover 提亮；no-drag 防成拖拽误触区 */
  #kbClose, #kbOpen, #kbFeishu, #kbReset, #kbResize {
    position: absolute;
    right: 8px;
    width: 18px;
    height: 18px;
    padding: 0;
    border: none;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.08);
    color: rgba(232, 234, 244, 0.65);
    font-size: 11px;
    line-height: 18px;
    text-align: center;
    cursor: pointer;
    -webkit-app-region: no-drag;
  }
  #kbClose { top: 7px; }
  #kbOpen { bottom: 7px; right: 74px; font-size: 12px; }
  #kbFeishu { bottom: 7px; right: 52px; }
  #kbReset { bottom: 7px; right: 30px; font-size: 12px; }
  #kbResize { bottom: 7px; cursor: nwse-resize; }
  #kbFeishu svg, #kbResize svg { vertical-align: middle; margin-top: -2px; }
  #kbClose:hover, #kbOpen:hover, #kbFeishu:hover, #kbReset:hover, #kbResize:hover { background: rgba(255, 255, 255, 0.2); color: #ffffff; }
  /* 底部操作提示：与正文用分隔线拉开，右侧留出右下角四个按钮的位置 */
  .kb-hint {
    display: block;
    font-size: 11px;
    font-weight: 400;
    opacity: 0.55;
    margin-top: 10px;
    padding: 7px 100px 0 0;
    border-top: 1px solid rgba(255, 255, 255, 0.12);
    -webkit-app-region: drag;
    user-select: none;
  }
</style>
  <link rel="stylesheet" href="../node_modules/katex/dist/katex.min.css">
</head>
<body>
  <div id="kb">
    <button id="kbClose" title="关闭">✕</button>
    <button id="kbOpen" title="打开 kira 对话">💬</button>
    <button id="kbFeishu" title="在飞书中打开"><svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true"><path fill="#3370FF" d="M3 16.5C3 10 8 5 14.5 5c2.3 0 4.4.7 6.1 1.9-3 .3-5.6 1.9-7.1 4.6H3z"/><path fill="#36CFFF" d="M3 18.6h9.3c-.9 1.9-2.9 3.4-5.3 3.4-1.9 0-3.4-1.3-4-3.4z"/><path fill="#2DD4BF" d="M14.6 13.2h6.2c-.7 3.2-3.6 5.8-7 5.8h-2.2c.6-2.6 1.5-4.7 3-5.8z"/></svg></button>
    <button id="kbReset" title="恢复默认位置">↺</button>
    <button id="kbResize" title="拖拽调整大小"><svg viewBox="0 0 12 12" width="10" height="10" aria-hidden="true"><path d="M10.5 1.5 L1.5 10.5 M10.5 5.5 L5.5 10.5 M10.5 9.5 L9.5 10.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" fill="none"/></svg></button>
    <div id="kbText" class="md"></div>
    <span class="kb-hint">✦ 点击后 Esc 关闭 · 双击打开 kira</span>
  </div>
  <script src="../node_modules/markdown-it/dist/browser/markdown-it.umd.min.js"></script>
  <script src="../node_modules/katex/dist/katex.min.js"></script>
  <script src="../node_modules/katex/dist/contrib/auto-render.min.js"></script>
  <script src="markdown-stream.js"></script>
  <script src="kira_bubble.js"></script>
</body>
</html>
