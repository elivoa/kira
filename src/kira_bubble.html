<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
  }
  /* kira 消息泡泡：奶油浅色风，配色直接抄本本 .msg.Kira .bubble（暖浅灰渐变底 + 深色正文） */
  #kb {
    position: absolute;
    /* left:50%+translate 会让 shrink-to-fit 的可用宽度只剩半窗（泡泡永远 ≤280px），
       改成 left/right:0 + margin auto 居中，fit-content 才能真的吃到 max-width */
    left: 0;
    right: 0;
    margin: 0 auto;
    width: fit-content;
    box-sizing: border-box;
    bottom: 44px; /* 装粘性光晕（6+22px × 缩放上限，防窗口底边切直线） */
    /* 宽度上限跟窗口走（默认 600-80=520 同旧值）：右下角手柄拖大窗口后泡泡才能真正变宽 */
    max-width: calc(100vw - 80px);
    padding: 12px 32px 14px 20px; /* 右侧给关闭按钮留位，别压正文 */
    border-radius: 18px;
    background: linear-gradient(180deg, #cfccc4, #b3afa5);
    border: 1px solid #948f83;
    color: #24231e;
    font: 400 13px/1.6 "PingFang SC", sans-serif; /* 字号/字重对齐小本本 .bubble.md（14px 常规），避免粗体感 */
    opacity: 0;
    transition: opacity .18s ease, zoom .18s ease;
    pointer-events: none;
    animation: stickyGlow 2s ease-in-out infinite alternate;
    /* 框的边缘是拖拽区；文字本身不拖（可选中） */
    -webkit-app-region: drag;
  }
  #kb.show { opacity: 1; pointer-events: auto; }
  @keyframes stickyGlow {
    from { box-shadow: 0 6px 18px rgba(0, 0, 0, 0.30), 0 0 5px rgba(230, 226, 216, 0.20); }
    to { box-shadow: 0 6px 22px rgba(0, 0, 0, 0.38), 0 0 14px rgba(230, 226, 216, 0.40); }
  }
  #kb::after {
    content: '';
    position: absolute;
    left: 50%;
    bottom: -6px;
    margin-left: -6px;
    border: 6px solid transparent;
    border-top-color: #b3afa5; /* 咬住渐变底端色，尾巴不脱节 */
    border-bottom: 0;
  }
  /* 顶部拖拽条：整片 drag，按住标题栏一带直接拖走泡泡；✕ 按钮自带 no-drag 不受影响 */
  .kb-head {
    height: 30px;
    margin: 0 0 2px;
    user-select: none;
    -webkit-app-region: drag;
  }
  /* Q 版人物完整立绘悬贴卡片左上角：上边、左边各冒出卡体一点（绝对定位不卡流），
     无圆圈裁切；自身也是 drag 区——按住悬贴的人物同样能拖走泡泡 */
  .kb-avatar {
    position: absolute;
    left: -16px;
    top: -20px;
    width: 56px;
    -webkit-app-region: drag;
    filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.35));
  }
  .kb-avatar img {
    width: 100%;
    display: block;
    -webkit-user-drag: none;
  }
  /* 消息区：kira 正文（无气泡，沿用原正文样式）+ 自己的居右气泡，上下滚动；
     跟窗口高度走（默认 520-212=308）：窗口拖高后长文能少滚动；
     比卡体其余部分多留 12px——给悬贴人物冒出卡顶的 20px 留窗口头部余量，长文顶满时不被窗顶裁切 */
  #kbMsgs {
    -webkit-app-region: no-drag;
    user-select: text;
    -webkit-user-select: text;
    cursor: text;
    max-height: calc(100vh - 212px);
    overflow-y: auto;
  }
  /* 自己的消息：居右深气泡（色值抄本本 .msg.me，深底压在奶油浅卡上对比清晰） */
  .kb-msg { margin-top: 8px; }
  .kb-msg.me { display: flex; justify-content: flex-end; }
  .kb-msg.me .kb-bubble {
    max-width: 84%;
    padding: 6px 12px;
    border-radius: 12px 12px 4px 12px;
    background: #252422;
    border: 1px solid #34332d;
    color: #e7e5de;
    font-size: 13px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
  }
  /* kira 的等待行：回复到达后摘掉 typing 变成正式正文行 */
  .kb-msg.kira.typing { opacity: 0.6; font-size: 12px; }
  .kb-msg.kira.typing::after {
    content: '';
    display: inline-block;
    width: 2.2em;
    animation: typingDots 1.2s steps(1) infinite;
  }
  @keyframes typingDots {
    0% { content: ''; }
    25% { content: '  ·'; }
    50% { content: '  · ·'; }
    75% { content: '  · · ·'; }
  }
  /* markdown 样式对齐本本 .bubble.md（间距/字号一致）；颜色抄本本浅底体系：正文深色，code/pre 保持深底浅字 */
  .kb-md p { margin: 0 0 8px; }
  .kb-md p:last-child { margin-bottom: 0; }
  .kb-md h1, .kb-md h2, .kb-md h3, .kb-md h4 { margin: 6px 0; font-size: 14px; font-weight: 600; }
  /* PingFang SC 的 bold(700) 在小字号下糊成一团，压到 600 */
  .kb-md strong, .kb-md b { font-weight: 600; }
  .kb-md ul, .kb-md ol { margin: 0 0 8px; padding-left: 20px; }
  .kb-md blockquote { margin: 0 0 8px; padding-left: 10px; border-left: 3px solid #3b3933; color: #44423c; }
  .kb-md code { font-family: "SF Mono", Menlo, monospace; font-size: 12px; background: #2f2e29; color: #e7e5de; border-radius: 4px; padding: 1px 4px; }
  .kb-md pre { background: #2f2e29; color: #e7e5de; border-radius: 8px; padding: 8px 10px; margin: 0 0 8px; overflow-x: auto; }
  .kb-md pre code { background: none; padding: 0; }
  .kb-md table { border-collapse: collapse; margin: 0 0 8px; font-size: 12px; }
  .kb-md th, .kb-md td { border: 1px solid #3b3933; padding: 3px 8px; }
  .kb-md hr { border: none; border-top: 1px dashed #3b3933; margin: 8px 0; }
  .kb-md .katex-display { margin: 0 0 8px; overflow-x: auto; overflow-y: hidden; padding: 2px 0; }
  .kb-md a { color: #6e5622; text-decoration: underline; cursor: pointer; }
  .kb-md a:hover { cursor: pointer; }
  /* 消息区滚动条：暖灰细条，融进奶油底 */
  #kbMsgs::-webkit-scrollbar { width: 6px; }
  #kbMsgs::-webkit-scrollbar-thumb { background: rgba(36, 35, 30, 0.22); border-radius: 3px; }
  #kbMsgs::-webkit-scrollbar-track { background: transparent; }
  /* 角落小圆钮（右上 ✕ 关闭 / 右下 💬 打开 kira、飞书、复位、拖拽手柄 / 左下 ⤢ 放大）：半透明深调，hover 加深；no-drag 防成拖拽误触区 */
  #kbClose, #kbOpen, #kbFeishu, #kbReset, #kbResize, #kbZoom {
    position: absolute;
    right: 8px;
    width: 18px;
    height: 18px;
    padding: 0;
    border: none;
    border-radius: 50%;
    background: rgba(36, 35, 30, 0.08);
    color: rgba(36, 35, 30, 0.55);
    font-size: 11px;
    line-height: 18px;
    text-align: center;
    cursor: pointer;
    -webkit-app-region: no-drag;
  }
  #kbClose { top: 7px; }
  #kbOpen { bottom: 7px; right: 74px; font-size: 12px; }
  #kbFeishu { bottom: 7px; right: 52px; }
  #kbReset { bottom: 7px; right: 30px; font-size: 12px; }
  #kbResize { bottom: 7px; cursor: nwse-resize; }
  /* 左下角放大钮：与右下角那排同款但弱化（常驻半透），放大态常亮表示可再点缩回 */
  #kbZoom { left: 8px; right: auto; bottom: 7px; opacity: 0.45; }
  #kbZoom:hover, #kbZoom.on { opacity: 1; }
  #kbZoom.on { background: rgba(36, 35, 30, 0.16); color: #24231e; }
  #kbFeishu svg, #kbResize svg, #kbZoom svg { vertical-align: middle; margin-top: -2px; }
  #kbClose:hover, #kbOpen:hover, #kbFeishu:hover, #kbReset:hover, #kbResize:hover { background: rgba(36, 35, 30, 0.16); color: #24231e; }
  /* 底部输入区：浅底协调款（半透白底 textarea + 本本同款浅色发送钮），
     整体 no-drag 别和边缘拖拽打架；min-width 兜底：fit-content 下短回复时输入区不缩没 */
  .kb-inputrow {
    display: flex;
    gap: 8px;
    align-items: flex-end;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed rgba(36, 35, 30, 0.18);
    min-width: 250px;
    -webkit-app-region: no-drag;
  }
  #kbInput {
    flex: 1;
    border: 1px solid rgba(36, 35, 30, 0.25);
    border-radius: 10px;
    padding: 7px 12px;
    font: 13px/1.45 "PingFang SC", sans-serif;
    outline: none;
    background: rgba(255, 255, 255, 0.42);
    color: #24231e;
    resize: none;
    overflow-y: auto;
    user-select: text;
    -webkit-user-select: text;
  }
  #kbInput:focus { border-color: rgba(36, 35, 30, 0.5); }
  #kbInput::placeholder { color: #76736a; }
  #kbSend {
    flex: none;
    border: none;
    background: #dddad1;
    color: #1b1a17;
    font: 13px "PingFang SC", sans-serif;
    padding: 0 16px;
    height: 33px;
    border-radius: 10px;
    cursor: pointer;
  }
  #kbSend:hover { background: #c2beb2; }
  /* 底部操作提示：跟在输入区后面当页脚，右侧留出右下角四个按钮的位置 */
  .kb-hint {
    display: block;
    font-size: 11px;
    font-weight: 400;
    opacity: 0.55;
    margin-top: 6px;
    padding: 0 100px 0 0;
    -webkit-app-region: drag;
    user-select: none;
  }
</style>
  <link rel="stylesheet" href="../node_modules/katex/dist/katex.min.css">
</head>
<body>
  <div id="kb">
    <button id="kbClose" title="关闭">✕</button>
    <button id="kbOpen" title="打开 kira 对话">💬</button>
    <button id="kbFeishu" title="在飞书中打开"><svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true"><path fill="#3370FF" d="M3 16.5C3 10 8 5 14.5 5c2.3 0 4.4.7 6.1 1.9-3 .3-5.6 1.9-7.1 4.6H3z"/><path fill="#36CFFF" d="M3 18.6h9.3c-.9 1.9-2.9 3.4-5.3 3.4-1.9 0-3.4-1.3-4-3.4z"/><path fill="#2DD4BF" d="M14.6 13.2h6.2c-.7 3.2-3.6 5.8-7 5.8h-2.2c.6-2.6 1.5-4.7 3-5.8z"/></svg></button>
    <button id="kbReset" title="恢复默认位置">↺</button>
    <button id="kbResize" title="拖拽调整大小"><svg viewBox="0 0 12 12" width="10" height="10" aria-hidden="true"><path d="M10.5 1.5 L1.5 10.5 M10.5 5.5 L5.5 10.5 M10.5 9.5 L9.5 10.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" fill="none"/></svg></button>
    <button id="kbZoom" title="放大"><svg viewBox="0 0 12 12" width="10" height="10" aria-hidden="true"><path d="M1.5 4.2 V1.5 H4.2 M7.8 1.5 H10.5 V4.2 M10.5 7.8 V10.5 H7.8 M4.2 10.5 H1.5 V7.8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" fill="none"/></svg></button>
    <div class="kb-head"><span class="kb-avatar"><img src="../assets/chibi.png" draggable="false" alt="kira"></span></div>
    <div id="kbMsgs">
      <div id="kbText" class="kb-md"></div>
    </div>
    <div class="kb-inputrow">
      <textarea id="kbInput" rows="1" placeholder="发消息给 kira…"></textarea>
      <button id="kbSend">发送</button>
    </div>
    <span class="kb-hint">✦ 点击后 Esc 关闭 · 双击打开 kira</span>
  </div>
  <script src="../node_modules/markdown-it/dist/browser/markdown-it.umd.min.js"></script>
  <script src="../node_modules/katex/dist/katex.min.js"></script>
  <script src="../node_modules/katex/dist/contrib/auto-render.min.js"></script>
  <script src="markdown-stream.js"></script>
  <script src="kira_bubble.js"></script>
</body>
</html>
