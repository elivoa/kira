<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>kiki 的小本子</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    font: 14px/1.6 "PingFang SC", sans-serif;
    color: #33304f;
    /* 笔记本横线纸 + 红边线 */
    background:
      linear-gradient(to right, transparent 34px, rgba(224, 106, 138, 0.35) 34px, rgba(224, 106, 138, 0.35) 36px, transparent 36px),
      repeating-linear-gradient(to bottom, #fbfaf5 0, #fbfaf5 30px, #dfe4f0 30px, #dfe4f0 31px);
  }
  .head {
    padding: 10px 16px 8px 44px;
    font-weight: 700;
    font-size: 15px;
    border-bottom: 1px dashed #d9d5ec;
    user-select: none;
  }
  .head .tip { font-weight: 400; font-size: 11px; color: #a49ec4; }
  #msgs {
    flex: 1;
    overflow-y: auto;
    padding: 12px 14px 12px 44px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg { display: flex; gap: 8px; max-width: 92%; }
  .msg.kiki { align-self: flex-start; }
  .msg.me { align-self: flex-end; flex-direction: row-reverse; }
  .msg .avatar {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 1px 4px rgba(60,50,120,.18);
    flex: none;
    object-fit: cover;
  }
  .bubble {
    padding: 7px 12px;
    border-radius: 12px;
    background: #fff;
    box-shadow: 0 1px 4px rgba(60, 50, 120, 0.1);
    word-break: break-all;
    white-space: pre-wrap;
  }
  .msg.me .bubble { background: #7d6fd0; color: #fff; }
  .msg.kiki .bubble.cmd {
    font-family: "SF Mono", Menlo, monospace;
    font-size: 12px;
    cursor: pointer;
  }
  .msg.kiki .bubble.cmd:hover { background: #f0edfc; }
  .msg.kiki .bubble.cmd::after {
    content: '点击复制';
    display: block;
    font-size: 10px;
    color: #a49ec4;
    margin-top: 2px;
  }
  .inputrow {
    display: flex;
    gap: 8px;
    padding: 10px 14px 12px 44px;
    border-top: 1px dashed #d9d5ec;
  }
  #input {
    flex: 1;
    border: 1px solid #d9d5ec;
    border-radius: 10px;
    padding: 8px 12px;
    font: 13px "PingFang SC", sans-serif;
    outline: none;
    background: #fff;
  }
  #input:focus { border-color: #7d6fd0; }
  #send {
    border: none;
    background: #7d6fd0;
    color: #fff;
    font: 13px "PingFang SC", sans-serif;
    padding: 0 16px;
    border-radius: 10px;
    cursor: pointer;
  }
  #send:hover { background: #6b5dc4; }
</style>
</head>
<body>
  <div class="head">kiki 的小本子<div class="tip">拖一个链接进来，或者直接在下面输入</div></div>
  <div id="msgs"></div>
  <div class="inputrow">
    <input id="input" placeholder="输入或拖入链接…" autofocus>
    <button id="send">发送</button>
  </div>
  <script src="notebook.js"></script>
</body>
</html>
