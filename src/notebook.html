<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Kira 的小本子</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    font: 14px/1.6 "PingFang SC", sans-serif;
    color: #33304f;
    background: #fff;
  }
  /* 左侧书脊 + 侧页签 */
  .spine {
    width: 96px;
    flex: none;
    background: linear-gradient(180deg, #8f83d8, #7d6fd0 60%, #6b5dc4);
    display: flex;
    flex-direction: column;
    padding-top: 14px;
    user-select: none;
  }
  .brand {
    color: rgba(255, 255, 255, 0.85);
    font-weight: 700;
    font-size: 13px;
    padding: 0 12px 12px;
  }
  .tab {
    border: none;
    text-align: left;
    font: 13px "PingFang SC", sans-serif;
    padding: 10px 8px 10px 12px;
    margin: 3px 0 3px 10px;
    border-radius: 9px 0 0 9px;
    background: rgba(255, 255, 255, 0.22);
    color: #fff;
    cursor: pointer;
  }
  .tab:hover { background: rgba(255, 255, 255, 0.35); }
  .tab.active {
    background: #fff;
    color: #33304f;
    font-weight: 600;
    box-shadow: -3px 2px 6px rgba(40, 30, 90, 0.2);
  }
  /* 右侧内容 */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    /* 笔记本横线纸 + 红边线 */
    background:
      linear-gradient(to right, transparent 22px, rgba(224, 106, 138, 0.3) 22px, rgba(224, 106, 138, 0.3) 24px, transparent 24px),
      repeating-linear-gradient(to bottom, #fbfaf5 0, #fbfaf5 30px, #dfe4f0 30px, #dfe4f0 31px);
  }
  .page {
    flex: 1;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .page.hidden { display: none; }
  .msgs {
    flex: 1;
    overflow-y: auto;
    padding: 14px 16px 14px 36px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg { display: flex; gap: 8px; max-width: 88%; }
  .msg.Kira { align-self: flex-start; }
  .msg.me { align-self: flex-end; flex-direction: row-reverse; }
  .msg .avatar {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 1px 4px rgba(60,50,120,.18);
    flex: none;
    object-fit: cover;
  }
  .bubble {
    padding: 8px 13px;
    border-radius: 12px;
    background: #fff;
    box-shadow: 0 1px 4px rgba(60, 50, 120, 0.1);
    word-break: break-all;
    white-space: pre-wrap;
  }
  .msg.me .bubble { background: #7d6fd0; color: #fff; }
  .msg.Kira .bubble.cmd {
    font-family: "SF Mono", Menlo, monospace;
    font-size: 12px;
    cursor: pointer;
  }
  .msg.Kira .bubble.cmd:hover { background: #f0edfc; }
  .msg.Kira .bubble.cmd::after {
    content: '点击复制';
    display: block;
    font-size: 10px;
    color: #a49ec4;
    margin-top: 2px;
  }
  .inputrow {
    display: flex;
    gap: 8px;
    padding: 10px 14px 12px 36px;
    border-top: 1px dashed #d9d5ec;
  }
  .inputrow.hidden { display: none; }
  #input {
    flex: 1;
    border: 1px solid #d9d5ec;
    border-radius: 10px;
    padding: 8px 12px;
    font: 13px "PingFang SC", sans-serif;
    outline: none;
    background: #fff;
  }
  #input:focus { border-color: #7d6fd0; }
  #send {
    border: none;
    background: #7d6fd0;
    color: #fff;
    font: 13px "PingFang SC", sans-serif;
    padding: 0 18px;
    border-radius: 10px;
    cursor: pointer;
  }
  #send:hover { background: #6b5dc4; }
  /* 日志页 */
  .logbar {
    display: flex;
    justify-content: flex-end;
    padding: 10px 14px 0 36px;
  }
  #clearLog {
    border: none;
    background: #e8e6f2;
    color: #5b5680;
    font: 12px "PingFang SC", sans-serif;
    padding: 4px 12px;
    border-radius: 8px;
    cursor: pointer;
  }
  .entry {
    display: flex;
    align-items: baseline;
    gap: 8px;
    background: #fff;
    border-radius: 10px;
    padding: 6px 10px;
    font-size: 12px;
    box-shadow: 0 1px 3px rgba(60, 50, 120, 0.08);
  }
  .time { color: #a49ec4; font-size: 11px; flex: none; font-variant-numeric: tabular-nums; }
  .type { flex: none; font-size: 11px; padding: 1px 7px; border-radius: 6px; color: #fff; }
  .type-自主 { background: #7d6fd0; }
  .type-交互 { background: #e06a8a; }
  .type-系统 { background: #9a93b8; }
  .empty { color: #a49ec4; text-align: center; margin-top: 60px; }
</style>
</head>
<body>
  <div class="spine">
    <div class="brand">Kira<br>的小本子</div>
    <button class="tab active" data-tab="chat">实时聊天</button>
    <button class="tab" data-tab="mr">MR Link</button>
    <button class="tab" data-tab="log">日志</button>
  </div>
  <div class="main">
    <div id="page-chat" class="page"><div id="chatMsgs" class="msgs"></div></div>
    <div id="page-mr" class="page hidden"><div id="mrMsgs" class="msgs"></div></div>
    <div id="page-log" class="page hidden">
      <div class="logbar"><button id="clearLog">清空日志</button></div>
      <div id="logList" class="msgs"></div>
    </div>
    <div class="inputrow">
      <input id="input" placeholder="说点什么，或拖入链接…" autofocus>
      <button id="send">发送</button>
    </div>
  </div>
  <script src="phrases.js"></script>
  <script src="notebook.js"></script>
</body>
</html>
